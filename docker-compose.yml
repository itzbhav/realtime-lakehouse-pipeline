services:
  kafka:
    image: apache/kafka:3.7.2
    hostname: kafka
    container_name: de-proj-kafka
    ports:
      - "9092:9092" # host access (producer.py runs on your machine)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    hostname: minio
    container_name: de-proj-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: de-proj-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin123 &&
       mc mb --ignore-existing local/lakehouse"
    restart: "no"

  postgres:
    image: postgres:16.15
    hostname: postgres
    container_name: de-proj-postgres
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  hive-warehouse-init:
    image: busybox:1.36
    container_name: de-proj-hive-warehouse-init
    volumes:
      - hive_warehouse:/warehouse
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /warehouse"]
    restart: "no"

  hive-metastore:
    image: apache/hive:3.1.3
    hostname: hive-metastore
    container_name: de-proj-hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
      hive-warehouse-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepassword
    volumes:
      - ./drivers/postgresql-42.7.13.jar:/opt/hive/lib/postgres.jar:ro
      - hive_warehouse:/warehouse
    ports:
      - "9083:9083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  spark:
    image: bitnamilegacy/spark:3.5.6
    hostname: spark
    container_name: de-proj-spark
    user: root
    command: ["sleep", "infinity"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    volumes:
      - ./:/app
      - ./hive-site.xml:/opt/bitnami/spark/conf/hive-site.xml:ro
      - spark_ivy_cache:/root/.ivy2
      - hive_warehouse:/warehouse
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy

volumes:
  minio_data:
  spark_ivy_cache:
  hive_warehouse:

networks:
  default:
    name: lakehouse-net
